apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ivolve-devops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/abdelazizamer/iVolveFinalProject.git
    targetRevision: main
    path: k8s
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
