<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
<title id="title">iVolve × NTI | Cloud DevOps Architecture</title>
<desc id="desc">GitHub Actions builds and scans images, publishes them to ECR, and updates manifests. Argo CD deploys into private EKS. Internal services use MySQL on encrypted EBS storage.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#111b2c"/></linearGradient>
<marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5 1 9Z" fill="#78aefc"/></marker>
<marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5 1 9Z" fill="#55d6a2"/></marker>
<symbol id="github-logo" viewBox="0 0 24 24"><path fill="#f1f5f9" d="M12 .9A11.1 11.1 0 0 0 8.5 22c.55.1.75-.24.75-.53v-1.87c-3.1.67-3.75-1.32-3.75-1.32-.51-1.29-1.24-1.64-1.24-1.64-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15.99 1.7 2.6 1.21 3.23.93.1-.72.39-1.21.71-1.49-2.48-.28-5.08-1.24-5.08-5.52 0-1.22.44-2.22 1.15-3-.12-.28-.5-1.42.11-2.96 0 0 .94-.3 3.08 1.15a10.7 10.7 0 0 1 5.6 0c2.14-1.45 3.08-1.15 3.08-1.15.61 1.54.23 2.68.11 2.96.71.78 1.15 1.78 1.15 3.01 0 4.27-2.61 5.23-5.1 5.51.4.35.76 1.02.76 2.06v3.05c0 .29.2.63.77.53A11.1 11.1 0 0 0 12 .9Z"/></symbol><symbol id="ecr-logo" viewBox="0 0 24 24"><path d="M12 2 21 7v10l-9 5-9-5V7l9-5Zm0 2.5L6 7.8l6 3.4 6-3.4-6-3.3Zm-7 5v6.1l6 3.3v-6l-6-3.4Zm14 0-6 3.4v6l6-3.3V9.5Z" fill="#fb923c"/></symbol><symbol id="tf-logo" viewBox="0 0 24 24"><path fill="#a78bfa" d="M2 2h20v6H14v14H8V8H2z"/></symbol><symbol id="eks-logo" viewBox="0 0 24 24"><g fill="none" stroke="#60a5fa" stroke-width="2"><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="9"/><path d="M12 1v4M12 19v4M1 12h4m14 0h4M4.2 4.2l2.9 2.9m9.8 9.8 2.9 2.9m0-15.6-2.9 2.9m-9.8 9.8-2.9 2.9"/></g></symbol><symbol id="argo-logo" viewBox="0 0 24 24"><path fill="#a78bfa" d="M2 18h20l-3 4H6l-4-4Zm9-16 1 14H9l2-14Zm2 4 7 10h-6l-1-10Z"/></symbol><symbol id="mysql-logo" viewBox="0 0 24 24"><path fill="none" stroke="#f6a34a" stroke-width="2" d="M3 6c0-2 4-4 9-4s9 2 9 4-4 4-9 4-9-2-9-4Zm0 0v6c0 2 4 4 9 4s9-2 9-4V6m-18 6v6c0 2 4 4 9 4s9-2 9-4v-6"/></symbol><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#e7edf7}.title{font-size:30px;font-weight:750}.sub{font-size:14px;fill:#91a6c2}.sec{font-size:15px;font-weight:750;fill:#79adff;letter-spacing:.4px}.h{font-size:15px;font-weight:700}.b{font-size:12px;fill:#c2cee0}.s{font-size:11px;fill:#9badc4}</style>
</defs>
<rect width="1440" height="1000" rx="24" fill="url(#bg)"/>
<text x="46" y="48" class="title">iVolve × NTI | Cloud DevOps Architecture</text><text x="48" y="73" class="sub">GitHub Actions owns CI · Argo CD owns CD · Terraform provisions AWS</text>
<rect x="36" y="96" width="1368" height="273" rx="18" fill="#0e1b2d" stroke="#304a6b" stroke-width="1.5"/><text x="58" y="125" class="sec">01 · SOURCE CONTROL &amp; CONTINUOUS INTEGRATION</text>
<g>
<rect x="60" y="148" width="285" height="166" rx="14" fill="#172941" stroke="#3c5c82"/><use href="#github-logo" x="76" y="162" width="23" height="23"/><text x="106" y="179" class="h">GitHub repository</text><text x="78" y="214" class="b">Application source code</text><text x="78" y="238" class="b">Kubernetes manifests</text><text x="78" y="262" class="b">main branch is desired state</text>
<rect x="390" y="148" width="285" height="166" rx="14" fill="#1a2d47" stroke="#3c5c82"/><use href="#github-logo" x="406" y="162" width="23" height="23"/><text x="436" y="179" class="h">GitHub Actions · CI</text><text x="408" y="214" class="b">Hosted runner builds 3 services</text><text x="408" y="238" class="b">Trivy scans container images</text><text x="408" y="262" class="b">OIDC role; no AWS keys stored</text>
<rect x="720" y="148" width="285" height="166" rx="14" fill="#292419" stroke="#a86c32"/><use href="#ecr-logo" x="736" y="162" width="23" height="23"/><text x="766" y="179" class="h">Amazon ECR</text><text x="738" y="214" class="b">Private repositories</text><text x="738" y="238" class="b">frontend · auth · roadmap</text><text x="738" y="262" class="b">Immutable Git-SHA image tags</text>
<rect x="1050" y="148" width="320" height="166" rx="14" fill="#172941" stroke="#3c5c82"/><use href="#github-logo" x="1066" y="162" width="23" height="23"/><text x="1096" y="179" class="h">Manifest update</text><text x="1068" y="214" class="b">CI commits image references</text><text x="1068" y="238" class="b">Argo CD watches this branch</text><text x="1068" y="262" class="b">No workflow kubectl deploy</text></g>
<path d="M345 230H380M675 230H710M1005 230H1040" fill="none" stroke="#78aefc" stroke-width="3" marker-end="url(#a)"/><text x="350" y="216" class="s">push</text><text x="680" y="216" class="s">scan + publish</text><text x="1008" y="216" class="s">new SHA</text>
<path d="M1210 315V408" fill="none" stroke="#55d6a2" stroke-width="3" marker-end="url(#g)"/><text x="1222" y="351" class="s" style="fill:#69e0b0">Argo CD sync</text>
<rect x="36" y="397" width="1368" height="548" rx="20" fill="#101f34" stroke="#35557a" stroke-width="1.8"/><text x="58" y="429" class="sec">02 · AWS CLOUD · us-east-1</text>
<rect x="58" y="451" width="248" height="460" rx="16" fill="#14243a" stroke="#2e4664"/>
<rect x="78" y="476" width="208" height="147" rx="12" fill="#192d47" stroke="#3e5b7c"/><use href="#tf-logo" x="90" y="490" width="23" height="23"/><text x="120" y="507" class="h">Terraform + S3</text><text x="96" y="535" class="b">VPC · subnets · NAT · ACLs</text><text x="96" y="558" class="b">EKS · ECR · IAM / OIDC</text><text x="96" y="581" class="b">Encrypted remote state</text>
<rect x="78" y="643" width="208" height="146" rx="12" fill="#192d47" stroke="#3e5b7c"/><use href="#github-logo" x="90" y="658" width="23" height="23"/><text x="120" y="675" class="h">CI identity</text><text x="96" y="703" class="b">GitHub OIDC trust</text><text x="96" y="726" class="b">ECR push permissions</text><text x="96" y="749" class="b">ECR only; no EKS deploy</text><text x="78" y="835" class="s">Private app · no public endpoint</text>
<rect x="333" y="451" width="1046" height="460" rx="17" fill="#0c1929" stroke="#59799e" stroke-width="1.7"/><text x="355" y="482" class="sec">VPC · TWO PUBLIC + TWO PRIVATE SUBNETS · TWO AZs</text>
<rect x="355" y="503" width="1002" height="386" rx="15" fill="#102137" stroke="#355371"/><text x="378" y="533" class="sec">PRIVATE AMAZON EKS · API ENDPOINT PRIVATE</text>
<rect x="378" y="552" width="290" height="94" rx="12" fill="#1a2e49" stroke="#5b7da4"/><use href="#eks-logo" x="392" y="564" width="23" height="23"/><text x="422" y="581" class="h">Amazon EKS</text><text x="398" y="606" class="b">2 managed worker nodes · t3.small</text><text x="398" y="628" class="s">Pulls images from ECR · EBS CSI · Pod Identity</text>
<rect x="704" y="552" width="290" height="94" rx="12" fill="#1b2943" stroke="#9a86eb"/><use href="#argo-logo" x="718" y="564" width="23" height="23"/><text x="748" y="581" class="h">Argo CD · CD</text><text x="724" y="606" class="b">Watches Git desired state</text><text x="724" y="628" class="s">Auto-sync · self-heal · private UI</text><path d="M994 598H1025" fill="none" stroke="#55d6a2" stroke-width="3" marker-end="url(#g)"/><text x="999" y="584" class="s">sync</text>
<rect x="1028" y="552" width="303" height="172" rx="13" fill="#142b3e" stroke="#317e99"/><text x="1047" y="580" class="h">Namespace: ivolve</text>
<rect x="1047" y="594" width="266" height="34" rx="8" fill="#19374c"/><text x="1060" y="616" class="b">Frontend · Node / Express · :3000</text>
<rect x="1047" y="635" width="266" height="34" rx="8" fill="#19374c"/><text x="1060" y="657" class="b">Auth Service · Flask · :5000</text>
<rect x="1047" y="676" width="266" height="34" rx="8" fill="#19374c"/><text x="1060" y="698" class="b">Roadmap API · Spring · :8080</text><text x="1047" y="741" class="s">All Services are ClusterIP · internal</text>
<rect x="378" y="682" width="616" height="163" rx="13" fill="#2a211a" stroke="#9b6838"/><use href="#mysql-logo" x="393" y="695" width="23" height="23"/><text x="423" y="712" class="h">Namespace: default · MySQL storage</text>
<rect x="399" y="729" width="264" height="91" rx="11" fill="#34271b" stroke="#b7793d"/><text x="418" y="760" class="h">MySQL StatefulSet</text><text x="418" y="786" class="b">mysql.default.svc:3306</text><text x="418" y="807" class="s">Existing data retained</text>
<rect x="699" y="729" width="286" height="91" rx="11" fill="#263247" stroke="#d2a84a"/><text x="718" y="760" class="h">Encrypted gp3 EBS</text><text x="718" y="786" class="b">PVC 5 GiB · Retain policy</text><text x="718" y="807" class="s">Provisioned by EBS CSI</text><path d="M663 775H689" fill="none" stroke="#f6a34a" stroke-width="3" marker-end="url(#a)"/>
<path d="M1047 651C1017 651 1017 774 1004 774" fill="none" stroke="#55d6a2" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#g)"/><text x="1008" y="754" class="s" style="fill:#69e0b0">Auth DB traffic</text>
<path d="M1210 408C1210 447 1115 470 1115 542" fill="none" stroke="#55d6a2" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#g)"/><path d="M287 550H323" fill="none" stroke="#93a9c4" stroke-width="2.5" marker-end="url(#a)"/>
<text x="40" y="974" class="s">No public ALB / Ingress / LoadBalancer is configured. App and Kubernetes API access are private.</text><text x="40" y="993" class="s">Last verified healthy Nov 23, 2026 · AWS account suspension observed Nov 24, 2026; recheck after access is restored.</text>
</svg>