name: Deploy to EKS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: eks-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy application
    runs-on: [self-hosted, linux, x64, ivolve-deploy]
    timeout-minutes: 35
    env:
      AWS_REGION: us-east-1
      EKS_CLUSTER_NAME: ivolve-devops-eks
      ECR_REPOSITORY_PREFIX: ivolve-devops
      K8S_NAMESPACE: default
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for Jenkins images in ECR
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_TAG="${GITHUB_SHA:0:12}"
          deadline=$((SECONDS + 1800))
          repositories=(frontend auth-service roadmap-service)

          while (( SECONDS < deadline )); do
            ready=true
            for repository in "${repositories[@]}"; do
              if ! aws ecr describe-images \
                --region "$AWS_REGION" \
                --repository-name "$ECR_REPOSITORY_PREFIX/$repository" \
                --image-ids "imageTag=$IMAGE_TAG" >/dev/null 2>&1; then
                ready=false
                break
              fi
            done

            if [[ "$ready" == true ]]; then
              echo "All three images are available with tag $IMAGE_TAG."
              exit 0
            fi

            echo "Waiting for Jenkins to publish image tag $IMAGE_TAG..."
            sleep 15
          done

          echo "Timed out waiting for Jenkins images in ECR."
          exit 1

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Create deployment secret
        shell: bash
        env:
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          set -euo pipefail
          : "${MYSQL_PASSWORD:?Add the MYSQL_PASSWORD repository secret}"
          : "${MYSQL_ROOT_PASSWORD:?Add the MYSQL_ROOT_PASSWORD repository secret}"
          : "${SESSION_SECRET:?Add the SESSION_SECRET repository secret}"

          kubectl create secret generic app-secrets \
            --namespace "$K8S_NAMESPACE" \
            --from-literal=MYSQL_PASSWORD="$MYSQL_PASSWORD" \
            --from-literal=MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
            --from-literal=SESSION_SECRET="$SESSION_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes workloads
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_TAG="${GITHUB_SHA:0:12}"
          AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          rendered_dir="$(mktemp -d)"
          trap 'rm -rf "$rendered_dir"' EXIT

          sed \
            -e "s/__AWS_ACCOUNT_ID__/$AWS_ACCOUNT_ID/g" \
            -e "s/__IMAGE_TAG__/$IMAGE_TAG/g" \
            k8s/workloads.yaml > "$rendered_dir/workloads.yaml"
          kubectl apply -f "$rendered_dir/workloads.yaml"

          for deployment in mysql auth-service roadmap-service frontend; do
            kubectl rollout status "deployment/$deployment" \
              --namespace "$K8S_NAMESPACE" --timeout=5m
          done
